
name: VSTV6 RSS Automation

on:
  schedule:
    # Run every hour at 17 minutes past UTC
    - cron: '17 * * * *'

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vstv6-rss-collector
  cancel-in-progress: false

jobs:
  collect-rss:
    name: Collect RSS News
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          test -n "$DATABASE_URL" || {
            echo "::error::DATABASE_URL secret is missing"
            exit 1
          }

          test -n "$RSS_FEEDS" || {
            echo "::error::RSS_FEEDS secret is missing"
            exit 1
          }

          test -n "$SECRET_KEY" || {
            echo "::error::SECRET_KEY secret is missing"
            exit 1
          }

          echo "Required secrets are configured."

      - name: Run RSS collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MYSQL_SSL_CA: ${{ secrets.MYSQL_SSL_CA }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m flask --app app collect-rss

      - name: Report completion
        if: success()
        run: echo "VSTV6 RSS collection completed successfully."

      - name: Report failure
        if: failure()
        run: echo "::error::VSTV6 RSS collection failed. Check the logs above."
