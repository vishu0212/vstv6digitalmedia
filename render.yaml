services:
  - type: web
    name: vstv6-digital-media
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: RSS_FEEDS
        value: "https://feeds.bbci.co.uk/news/world/rss.xml"
